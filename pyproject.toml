[tool.poetry]
name = "bank_masking"
version = "0.1.0"
description = "Виджет маскировки номеров карт и счетов"
authors = ["Ваше имя <email@example.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.0.0"
black = "^23.1.0"
isort = "^5.12.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
